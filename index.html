<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="stylesheets/style.css" />
        <title>10k-ime</title>
    </head>
    <body>
        <div class="app-container">
            <!-- Header Area -->
            <div class="header-area">

            <!-- 3x5 Button Grid -->
            <div class="button-grid">
                <!-- Row 1 -->
                <button class="btn" id="00">cand1</button>

                <button class="btn" id="02">cand3</button>
                <button class="btn" id="03">cand4</button>
                <button class="btn" id="04">cand5</button>

                <!-- Row 2 -->
                <button class="btn" id="10">up1</button>
                <button class="btn" id="11">up2</button>
                <button class="btn" id="12">up3</button>
                <button class="btn" id="13">up4</button>
                <button class="btn" id="14">up5</button>

                <!-- Row 3 -->
                <button class="btn" id="20">down1</button>
                <button class="btn" id="21">down2</button>
                <button class="btn" id="22">down3</button>
                <button class="btn" id="23">down4</button>
                <button class="btn" id="24">down5</button>
            </div>
        </div>
        <script type="module" src="runner/maps.js"></script>
        <script type="module" src="runner/read_data.js"></script>
        <script type="module" src="runner/ranker.js"></script>
        <script type="module" src="runner/main.js"></script>
    </body>
</html>
